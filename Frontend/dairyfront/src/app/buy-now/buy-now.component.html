<div class="col-sm-6 ">
    <div class="contact-box">

   
    <h1 class="text-center ">Payment Here</h1>
    <form (ngSubmit)="submitdata()">

        <div class="form-group">
            <label for="name">First name:</label>
            <input type="text" class="form-control" id="name" name="name" required [(ngModel)]="buy.firstname" >
        </div>
        
        <div class="form-group">
            <label for="name">Last name:</label>
            <input type="text" class="form-control" id="name" name="name" required [(ngModel)]="buy.lastname" >
        </div>
        

     
        
        <div class="form-group">
            <label for="text"> Address:</label>
            <input type="text" class="form-control" id="Address" name="Address"  required [(ngModel)]="buy.address">
        </div>

        <div class="form-group">
            <label for="text">phone:</label>
            <input type="text" class="form-control" id="phone" name="phone"  required [(ngModel)]="buy.phone">
        </div>

        <div class="form-group">
            <label for="name">productname:</label>
            <input type="text" class="form-control" id="name" name="name" required [(ngModel)]="buy.productname" >
        </div>

        <div class="form-group">
            <label for="city">quantity:</label>
            <select class="form-control" id="quantity" name="quantity"[(ngModel)]="buy.quantity" >
                <option value="">--Select--</option>
                <option>125g</option>
                <option>150g</option>
                <option>200g</option>
                <option>500g</option>
                <option>1kgg</option>
            </select>
        </div>
        <div class="form-group">
            <label for="text">price:</label>
            <select class="form-control" id="price" name="price" [(ngModel)]="buy.price">
                <option value="">--Select--</option>
                <option>50/-</option>
                <option>100/-</option>
                <option>200/-</option>
                <option>250/-</option>
                
            </select>
        </div>
        
       

      


        
        <button type="submit" class="btn btn-primary" >Submit</button>
    </form>
    </div>
</div>
