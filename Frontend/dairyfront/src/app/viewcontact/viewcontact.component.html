<div class="container">
    <h1 class="text-center">All contacts</h1>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Emailid</th>
                <th>Phone</th>
                <th>Message</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let c of corr">
                <td>{{c.conid}}</td>
                <td>{{c.name}}</td>
                <td>{{c.emailid}}</td>
                <td>{{c.phone}}</td>
                <td>{{c.message}}</td>

            </tr>
        </tbody>

    </table>

</div>
