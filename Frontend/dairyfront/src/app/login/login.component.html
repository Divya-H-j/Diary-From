<div style=" position: relative; text-align: center; color:black;">
    <div class="">
        <img src="cow103.jpg"  alt="Transparent Image" class="transparent-image"  style="width: 100%; height: 100%;">
    </div>
    <div style="position: absolute; font-family:Cambria, serif;  top: 60%; left: 50%; transform: translate(-50%, -50%); font-size:2mm;">
        
     
    


    <div class="container ">
        <div class="col-sm-12 form-box login">
            <form (ngSubmit)="submitdata()">
                <h1 class="text-center">Login Here</h1>
                <div class="input-box">
                    <label for="emailid" >Email Id:</label>
                    <input type="email" class="form-control" id="emailid" name="emailid" placeholder="Enter Your Email Id"[(ngModel)]="reg.emailid">
                   
                </div><br>
                <div class="input-box">
                    <label for="password">Password:</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter Your Password"
                        [(ngModel)]="reg.password">
                   
                </div>
                <br>
                <div class="forgot-link">
                    <a href="#">Forgot Password</a>
                </div>
                <br>
               
                <button type="submit" class="btn btn-success">Login</button>
               
                <h5 class="text-center"> login with social platform</h5>
                <br>
                <div class="social-icons">
                    <a href="#" class="social-icons1"><i class="bx bxl-google"></i></a>
                    <a href="#"  class="social-icons1"><i class="bx bxl-facebook"></i></a>
                    <a href="#"  class="social-icons1"><i class="bx bxl-github"></i></a>
                    <a href="#"  class="social-icons1"><i class="bx bxl-linkedin"></i></a>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
