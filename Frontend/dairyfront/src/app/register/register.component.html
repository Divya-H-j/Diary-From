<div style=" position: relative; text-align: center; color:black">
    <div class=" ">
        <img src="sing.jpg" style="width: 100%; height: 100%;" alt="Transparent Image" class="transparent-image">
    </div>
    <div
        style="position: absolute; font-family:Cambria, serif;  top: 60%; left: 50%; transform: translate(-50%, -50%); font-size:2mm;">


        <div class="container-fluid ">
            <div class="form-box row">
                <form (ngSubmit)="submitdata()" action="#">
                    <h1 class="text-center">Sing in</h1>
                    
                    <div class="col-md-12">
                        <div class="form-group col-sm-6">
                            <label for="name">Name:</label>
                            <input type="text" class="form-control" id="name" name="name" [(ngModel)]="reg.name"
                            placeholder="Enter Your Name"     required>

                        </div>
                        <div class="form-group col-sm-6">
                            <label for="address">Address:</label>
                            <input type="text" class="form-control" id="Address" name="Address" placeholder="Enter Your Address"
                                [(ngModel)]="reg.address" required>
                        </div>
                    </div>
                    <div class="col-md-12">
                        <div class="form-group col-sm-6">
                            <label for="city">City:</label>
                            <select class="form-control" id="city" name="city" [(ngModel)]="reg.city">
                                <option value="">--Select--</option>
                                <option>Satara</option>
                                <option>Pune</option>
                                <option>Mumbai</option>
                                <option>kholapur</option>
                            </select>
                        </div>
                        <div class="col-sm-6 text-center">
                            <label class="text-center">Gender:</label><br>
                            <label class="radio-inline"><input type="radio" name="gender" value="Male"
                                    [(ngModel)]="reg.gender ">Male</label>
                            <label class="radio-inline"><input type="radio" name="gender" value="Female"
                                    [(ngModel)]="reg.gender">Female</label>
                            <label class="radio-inline"><input type="radio" name="gender" value="Other"
                                    [(ngModel)]="reg.gender">Other</label>
                        </div>
                    </div>
                    <div class="col-md-12">
                        <div class="form-group col-sm-6">
                            <label for="contact">Contact:</label>
                            <input type="text" class="form-control" id="contact" name="contact"
                                [(ngModel)]="reg.contact" required>
                        </div>
                        <div class="form-group col-sm-6">
                            <label for="emailid">Email Address:</label>
                            <input type="email" class="form-control" id="emailid" name="emailid" placeholder="Enter Your Email Id"
                                [(ngModel)]="reg.emailid" required>
                        </div>
                    </div>
                    <div class="col-md-12">
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter Your Password"
                            [(ngModel)]="reg.password" required>
                    </div>
                </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="check1" name="option1" required>
                        <label class="form-check-label"> l accept the term of use and privaty policy</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Sing in</button>
                    <div>
                        <label for="text">Already have an account ?</label>

                        <button (click)="navigatetologin()" class="btn btn-success">Login here</button>
                    </div>

                </form>
            </div>
        </div>
    </div>


</div>
