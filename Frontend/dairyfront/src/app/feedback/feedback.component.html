
<div class="container-fluid feedback-section">
    <div class="row">
        
        <div class="col-sm-12">
            <h1 class="text-center">Valuable Feedback</h1>
            <form (ngSubmit)="submitdata()">
                <div class="form-group">
                    <label for="emailid">EmailId</label>
                    <textarea type="emailid" class="form-control" id="emailid" name="emailid" [(ngModel)]="fd.emailid"
                      placeholder="Enter Email "required ></textarea> 
                </div>
                
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea type="text" class="form-control" id="message" name="message" [(ngModel)]="fd.message"
                      placeholder="Enter Message Here" required></textarea> 
                </div>
            
                <button type="submit" class="btn btn-primary" >Submit</button>
            </form>
        </div>
    </div>
</div>
