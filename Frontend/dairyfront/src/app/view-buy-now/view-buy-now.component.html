<br><br><br><br><br><br><br><br><br>
<div class="container">
    <h1 class="text-center"> Registrations</h1>
    <table class="table table-bordered">
        <thead>
            <tr>

                <th>Id</th>
                <th>firstname</th>
                <th>lastname</th>
                <th>address</th>
                <th>phone</th>
                <th>Productname</th>
                <th>quantity</th>
                <th>price</th>
                
                
                
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let r of burr">
                <td>{{r.buyid}}</td>
                <td>{{r.firstname}}</td>
                <td>{{r.lastname}}</td>
                <td>{{r.address}}</td>
                <td>{{r.phone}}</td>
                <td>{{r.productname}}</td>
                <td>{{r.quantity}}</td>
                <td>{{r.price}}</td>
               
               
                
                
            </tr>
        </tbody>
    </table>
</div>
