<html lang="en">
    <body>
        
    
<div class="container">
    <h3>Add Prodect Here</h3>
    <form (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="prodectname">Prodect Name</label>
            <input type="text" class="form-control" id="prodectname" required [(ngModel)]="prodect.prodectname"
                name="prodectname">
        </div>
        <div class="form-group">
            <label for="prise">Prise</label>
            <input type="text" class="form-control" id="prise" required [(ngModel)]="prodect.prise" name="prise">
        </div>
        <div class="form-group">
            <label for="name">Prodect Images</label>
            <input type="file" class="form-control" id="name" required multiple value="select"
                (change)="onFileSelected($event)">
            <div class="row">
                <div *ngFor="let file of prodect.prodectImages;let i =index" class="col-sm-2">
                    <span class="close" (click)="removeImage(i)">x</span>
                    <img [src]="file.url" alt="" width="100px" height="100px">
                    </div>
                </div>


        </div>

        <button type="submit" class="btn btn-success">Submit</button>
    </form>
</div>
    </body>
</html>
